<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fraud Detection Graphs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <style>
        /* Animated Gradient Background */
        body {
            background: linear-gradient(-45deg, #2c3e50, #34495e, #1abc9c, #16a085);
            background-size: 400% 400%;
            animation: gradientMove 8s ease infinite;
            color: white;
            font-family: 'Poppins', sans-serif;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Card */
        .glass-card {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            animation: fadeInUp 1s ease-out;
        }

        /* Fade-in Animation */
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Title Styling */
        .title {
            font-size: 28px;
            font-weight: bold;
            color: #FFD700; /* Gold */
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 2px 2px 10px rgba(255, 215, 0, 0.7);
            margin-bottom: 18px;
        }

        /* Image Styling with Hover Effect */
        .graph-image {
            border-radius: 12px;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }

        .graph-image:hover {
            transform: scale(1.05);
            box-shadow: 0px 0px 15px rgba(255, 215, 0, 0.6);
        }

        /* Button Styling */
        .btn-custom {
            background: linear-gradient(135deg, #FFD700, #ffae00); /* Gold */
            color: black;
            font-weight: bold;
            border-radius: 12px;
            padding: 12px;
            font-size: 17px;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 10px rgba(255, 215, 0, 0.4);
            border: none;
        }

        .btn-custom:hover {
            background: linear-gradient(135deg, #ffae00, #FFD700);
            box-shadow: 0 6px 15px rgba(255, 215, 0, 0.6);
        }

    </style>
</head>
<body>

    <div class="container mt-5">
        <div class="glass-card">
            <h2 class="title">📊 Fraud Detection Graphs</h2>

            <div class="text-center mt-4">
                <h4>📈 Fraud vs. Legitimate (Percentage)</h4>
                <img src="{{ url_for('static', filename='fraud_pie_chart.png') }}" class="img-fluid border p-2 graph-image" alt="Fraud vs Legitimate Percentage">
            </div>

            <div class="text-center mt-4">
                <h4>📊 Fraud Probability Distribution (Percentage)</h4>
                <img src="{{ url_for('static', filename='fraud_probability_distribution.png') }}" class="img-fluid border p-2 graph-image" alt="Fraud Probability Distribution">
            </div>

            <div class="text-center mt-4">
                <a href="{{ url_for('home') }}" class="btn btn-custom">🔙 Back to Home</a>
            </div>
        </div>
    </div>

</body>
</html>

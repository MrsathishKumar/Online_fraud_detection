<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Fraudulent Transaction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* Full-screen background with overlay */
        body {
            background: url("{{ url_for('static', filename='reprt.png') }}") no-repeat center center fixed;
            background-size: cover;
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* Dark overlay for better contrast */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Semi-transparent overlay */
            z-index: 1;
        }

        /* Glassmorphism effect */
        .report-form {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            width: 450px;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }

        /* Hover effect for a modern look */
        .report-form:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        /* Stylish input fields */
        .form-control {
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 12px;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-control:focus {
            border: 1px solid #ff4c4c;
            box-shadow: 0 0 10px rgba(255, 76, 76, 0.5);
            background: rgba(255, 255, 255, 0.3);
        }

        /* Gradient button with animation */
        .btn-danger {
            width: 100%;
            border-radius: 10px;
            background: linear-gradient(45deg, #ff4c4c, #c40000);
            border: none;
            padding: 12px;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
        }

        .btn-danger:hover {
            background: linear-gradient(45deg, #c40000, #ff4c4c);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 76, 76, 0.4);
        }

        /* Stylish heading */
        h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: #ff4c4c;
            text-shadow: 0 0 10px rgba(255, 76, 76, 0.5);
        }
    </style>
</head>
<body>
    <div class="report-form">
        <h2>🚨 Report Fraudulent Transaction 🚨</h2>
        <form action="{{ url_for('submit_report') }}" method="post">
            <input type="hidden" name="transaction_id" value="{{ transaction_id }}">

            <div class="mb-3">
                <label class="form-label">Transaction ID:</label>
                <input type="text" class="form-control" value="{{ transaction_id }}" readonly>
            </div>

            <div class="mb-3">
                <label class="form-label">User Name:</label>
                <input type="text" name="user_name" class="form-control" placeholder="Enter your name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Reason for Reporting:</label>
                <textarea name="reason" class="form-control" rows="4" placeholder="Explain the issue..." required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Contact Email:</label>
                <input type="email" name="email" class="form-control" placeholder="Your email address" required>
            </div>

            <button type="submit" class="btn btn-danger">🚀 Submit Report</button>
        </form>
    </div>
</body>
</html>

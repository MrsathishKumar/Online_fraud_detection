<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fraud Prediction Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        /* Background Image with Dark Blue Neon Theme */
        body {
            
            background: url("{{ url_for('static', filename='prediction.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Overlay for Glass Effect */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Dark overlay */
            backdrop-filter: blur(5px);
            z-index: -1;
        }

        /* Particle Effect */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(15px);
            box-shadow: 0 4px 30px rgba(0, 255, 255, 0.3);
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease-in-out;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* Hover Effects with Neon Glow */
        .glass-card:hover {
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            transform: scale(1.02);
        }

        /* Animated Result Text */
        .result-text {
            font-size: 1.8rem;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
            animation: fadeIn 1s ease-in-out;
        }

        /* Color Coding */
        .fraud {
            color: #ff4c4c;
            background: rgba(255, 76, 76, 0.2);
            animation: blink 1s infinite alternate;
            text-shadow: 0 0 10px red;
        }

        .safe {
            color: #4caf50;
            background: rgba(76, 175, 80, 0.2);
            text-shadow: 0 0 10px lime;
        }

        /* Blinking Animation for Fraud Alert */
        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Animated Progress Bar */
        .progress {
            height: 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
        }

        .progress-bar {
            background: linear-gradient(90deg, #ff4c4c, #ff9f43);
            box-shadow: 0 0 10px rgba(255, 76, 76, 0.6);
            transition: width 1s ease-in-out;
        }

        /* Stylish Buttons */
        .btn-custom {
            font-size: 1rem;
            padding: 12px 25px;
            border-radius: 50px;
            transition: all 0.3s ease-in-out;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            border: none;
        }

        .btn-custom::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 10%, transparent 50%);
            transition: 0.4s ease-in-out;
            transform: translate(-50%, -50%) scale(0);
        }

        .btn-custom:hover::before {
            transform: translate(-50%, -50%) scale(1);
        }

        .btn-home {
            background: linear-gradient(135deg, #ff9f43, #ff6b6b);
            color: white;
        }

        .btn-home:hover {
            background: linear-gradient(135deg, #ff6b6b, #ff3f3f);
            transform: scale(1.1);
        }

        .btn-graph {
            background: linear-gradient(135deg, #17c0eb, #0abde3);
            color: white;
        }

        .btn-graph:hover {
            background: linear-gradient(135deg, #0abde3, #0652dd);
            transform: scale(1.1);
        }

        /* Fade-in animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Particle Effect -->
    <div id="particles-js"></div>

    <div class="container mt-5">
        <div class="glass-card">
            <h2>🔍 Prediction Result</h2>
            <p>Transaction ID: <strong>{{ transaction_id }}</strong></p>
<h3 class="result-text {% if result == 'Fraudulent' %}fraud{% else %}safe{% endif %}">
    {{ result }}
    <form action="{{ url_for('report_transaction') }}" method="post" class="mt-3">
        <input type="hidden" name="transaction_id" value="{{ transaction_id }}">
    </form>
</h3>



<!-- Show report button only if result is Fraudulent -->
{% if is_fraudulent %}
    <form action="{{ url_for('report_transaction') }}" method="post" class="mt-3">
        <input type="hidden" name="transaction_id" value="{{ transaction_id }}">
        <button type="submit" class="btn btn-danger px-4 py-2">🚨 Report Transaction</button>
    </form>
{% endif %}



            <!-- Animated Progress Bar -->
            <p>Fraud Probability: <strong>{{ probability | round(2) }}</strong></p>
            <div class="progress">
                <div class="progress-bar" role="progressbar" 
                    style="width: {{ probability * 100 }}%;" 
                    aria-valuenow="{{ probability * 100 }}" 
                    aria-valuemin="0" aria-valuemax="100">
                </div>
            </div>
<div class="mt-4 d-flex justify-content-center gap-3">
    <a href="/home" class="btn btn-custom btn-home">🔙 Back to Home</a>
    <a href="/graph" class="btn btn-custom btn-graph">📊 View Graphs</a>
    
    </form>
</div>

        </div>
    </div>

    <!-- Particle Effect Script -->
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80 },
                "color": { "value": "#00ffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.3 },
                "size": { "value": 2 },
                "move": { "speed": 2 }
            },
            "interactivity": {
                "events": { "onhover": { "enable": true, "mode": "repulse" } }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* 🌟 Cyberpunk Background with Animation */
        body {
            background: url("{{ url_for('static', filename='in.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Poppins', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* 🎨 Dark Transparent Overlay */
        .background-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }

        /* 🌟 Glassmorphism Login Box - More Contrast */
        .login-card {
            backdrop-filter: blur(25px);
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
            border: 2px solid rgba(255, 204, 0, 0.6);
            width: 380px;
            text-align: center;
            transition: 0.3s;
            position: relative;
            z-index: 2;
            animation: floating 5s infinite alternate;
        }

        /* ✨ Floating Animation */
        @keyframes floating {
            0% { transform: translateY(0px); }
            100% { transform: translateY(10px); }
        }

        /* 🛠 Neon Glow on Hover */
        .login-card:hover {
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.8);
            transform: scale(1.05);
        }

        /* 🔥 Animated Input Fields */
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            border-radius: 10px;
            padding: 12px;
            transition: 0.3s;
            font-size: 16px;
        }

        /* ✨ Neon Glow on Focus */
        .form-control:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 15px #ffcc00;
            outline: none;
            transform: scale(1.02);
        }

        /* 🎮 Cyberpunk Button */
        .btn-custom {
            background: linear-gradient(135deg, #ffcc00, #ff5733);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 10px;
            padding: 12px;
            font-size: 18px;
            transition: 0.3s ease-in-out;
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        /* 🔥 Neon Glow on Hover */
        .btn-custom:hover {
            background: linear-gradient(135deg, #ff5733, #ffcc00);
            box-shadow: 0 0 25px rgba(255, 204, 0, 1);
            transform: scale(1.07);
        }

        /* 💡 Button Click Effect */
        .btn-custom:active {
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(255, 255, 0, 1);
        }

        /* 🔴 Error Message */
        .alert-danger {
            background: rgba(255, 0, 0, 0.3);
            color: white;
            border: 1px solid rgba(255, 0, 0, 0.5);
            margin-top: 10px;
        }

        /* 🌟 Cyberpunk Title */
        .login-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.8);
        }
    </style>
</head>
<body>

    <!-- 🔥 Dark Overlay -->
    <div class="background-overlay"></div>

    <div class="login-card">
        <h2 class="login-title">🔐 User Login</h2>
        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <input type="text" class="form-control" name="username" placeholder="👤 Enter Username" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" name="password" placeholder="🔑 Enter Password" required>
            </div>
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <button type="submit" class="btn btn-custom w-100">💻 Login</button><br><br>
            <p>Don't have an account? <a href="/register">Register here</a></p>

        </form>
    </div>

</body>
</html>

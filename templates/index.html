<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transaction Fraud Detection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* Background Image */
        body {
            background: url("{{ url_for('static', filename='transaction.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            position: relative;
        }

        /* Dark Overlay for Contrast */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }

        /* Glassmorphism Neon Box */
        .glass-card {
            position: relative;
            z-index: 1;
            backdrop-filter: blur(14px);
            background: linear-gradient(135deg, rgba(255, 0, 150, 0.3), rgba(0, 255, 255, 0.3));
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.4);
            max-width: 420px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            animation: glow-animation 2s infinite alternate;
        }

        /* Hover Effect */
        .glass-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.6);
        }

        /* Glowing Animation */
        @keyframes glow-animation {
            from {
                border-color: rgba(255, 0, 150, 0.4);
                box-shadow: 0 0 15px rgba(255, 0, 150, 0.4);
            }
            to {
                border-color: rgba(0, 255, 255, 0.7);
                box-shadow: 0 0 25px rgba(0, 255, 255, 0.7);
            }
        }

        /* Title */
        .title {
            font-size: 28px;
            font-weight: bold;
            color: #FFD700; /* Bright Yellow */
            text-transform: uppercase;
            text-shadow: 4px 4px 12px rgba(255, 215, 0, 1);
            letter-spacing: 1.8px;
            margin-bottom: 18px;
        }

        /* Labels */
        .form-label {
            font-weight: bold;
            color: #FFD700;
            font-size: 16px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        /* Input Fields */
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            transition: all 0.3s ease-in-out;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-control:focus, .form-select:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 12px #00ffcc;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        /* Dropdown Styling */
        .form-select option {
            background: rgba(0, 0, 0, 0.9);
            color: white;
            font-size: 14px;
        }

        .form-select {
            cursor: pointer;
        }

        /* Buttons */
        .btn-custom {
            background: linear-gradient(135deg, #ff512f, #dd2476);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 12px;
            padding: 12px;
            font-size: 17px;
            box-shadow: 0 5px 18px rgba(255, 0, 128, 0.4);
            transition: all 0.3s ease-in-out;
        }

        .btn-custom:hover {
            background: linear-gradient(135deg, #dd2476, #ff512f);
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.6);
        }

        /* View Transaction History Button */
        .btn-history {
            background: linear-gradient(135deg, #2193b0, #6dd5ed);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 12px;
            padding: 12px;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0, 191, 255, 0.4);
            transition: all 0.3s ease-in-out;
        }

        .btn-history:hover {
            background: linear-gradient(135deg, #6dd5ed, #2193b0);
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.6);
        }

    </style>
</head>
<body>
    <div class="glass-card">
        <h2 class="title">🛡️ Transaction Fraud Detection</h2>
        <form action="/predict" method="POST">
            <div class="mb-2">
                <label class="form-label">Transaction ID:</label>
                <input type="text" name="transaction_id" class="form-control" placeholder="Enter Transaction ID" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Amount ($):</label>
                <input type="number" step="0.01" name="amount" class="form-control" placeholder="Enter Amount" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Phone Number:</label>
                <input type="text" name="phone_number" class="form-control" placeholder="Enter Phone Number" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Location:</label>
                <select name="location" class="form-select" required>
                    <option value="">Select Location</option>
                    <option>USA</option>
                    <option>India</option>
                    <option>UK</option>
                    <option>Russia</option>
                    <option>Nigeria</option>
                    <option>Germany</option>
                    <option>Brazil</option>
                    <option>Japan</option>
                    <option>Australia</option>
                    <option>Canada</option>
                    <option>France</option>
                    <option>South Africa</option>
                    <option>China</option>
                </select>
            </div>
            <button type="submit" class="btn btn-custom w-100">🔍 Predict</button>
            
        </form>
    </div>
</body>
</html>
